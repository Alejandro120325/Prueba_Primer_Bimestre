<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Información del Producto</h3>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${item.nombre}"></span></li>
                <li class="list-group-item"><strong>Categoría:</strong> <span th:text="${item.categoria}"></span></li>
                <li class="list-group-item"><strong>Cantidad en stock:</strong> <span th:text="${item.cantidad}"></span></li>
                <li class="list-group-item"><strong>Precio:</strong> $<span th:text="${item.precio}"></span></li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
